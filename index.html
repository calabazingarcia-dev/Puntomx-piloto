<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">

  <title>PuntoMX — Piloto</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Estilos PuntoMX -->
  <link rel="stylesheet" href="styles.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

  <!-- =========================
       ENCABEZADO
  ========================== -->

  <header class="topbar">

    <div>
      <div class="brand">
        PuntoMX
      </div>

      <div class="tagline">
        Reporta exactamente dónde está el problema.
      </div>
    </div>

    <!-- USUARIO -->
    <div
      id="authArea"
      style="
        display:flex;
        align-items:center;
        gap:8px;
      "
    >

      <button
        id="loginBtn"
        class="secondary"
        type="button"
      >
        👤 Iniciar sesión
      </button>

    </div>

    <!-- UBICACIÓN -->
    <button
      id="locateBtn"
      type="button"
    >
      📍
    </button>

  </header>


  <!-- =========================
       CONTENIDO PRINCIPAL
  ========================== -->

  <main>

    <!-- ESTADÍSTICAS -->

    <section class="stats">

      <div>
        <strong id="totalCount">
          0
        </strong>

        <span>
          Reportes
        </span>
      </div>

      <div>
        <strong id="pendingCount">
          0
        </strong>

        <span>
          Pendientes
        </span>
      </div>

      <div>
        <strong id="resolvedCount">
          0
        </strong>

        <span>
          Resueltos
        </span>
      </div>

    </section>


    <!-- MAPA -->

    <section class="map-wrap">

      <div id="map"></div>

      <button
        id="newReportBtn"
        class="fab"
        type="button"
      >
        ＋ Reportar problema
      </button>

    </section>


    <!-- LISTA DE REPORTES -->

    <section class="panel">

      <div class="panel-head">

        <h2>
          Mis reportes
        </h2>

        <button
          id="clearBtn"
          type="button"
        >
          Borrar piloto
        </button>

      </div>

      <div id="reports"></div>

    </section>

  </main>


  <!-- =========================
       MODAL DE LOGIN
  ========================== -->

  <div
    id="authModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="panel-head">

        <h2>
          Iniciar sesión
        </h2>

        <button
          id="closeAuthModal"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="authForm">

        <label>
          Correo electrónico

          <input
            id="authEmail"
            type="email"
            autocomplete="email"
            placeholder="correo@ejemplo.com"
            required
          >
        </label>


        <label>
          Contraseña

          <input
            id="authPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Contraseña"
            required
          >
        </label>


        <button
          id="authSubmit"
          class="primary"
          type="submit"
        >
          Iniciar sesión
        </button>


        <button
          id="signupBtn"
          class="secondary"
          type="button"
          style="width:100%;margin-top:10px;"
        >
          Crear cuenta
        </button>


        <div
          id="authMessage"
          style="
            margin-top:12px;
            font-size:14px;
            text-align:center;
          "
        ></div>

      </form>

    </div>

  </div>


  <!-- =========================
       NUEVO REPORTE
  ========================== -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="panel-head">

        <h2>
          Nuevo reporte
        </h2>

        <button
          id="closeModal"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="reportForm">

        <label>

          Tipo

          <select
            id="type"
            required
          >

            <option value="">
              Selecciona...
            </option>

            <option>
              💡 Luminaria apagada
            </option>

            <option>
              🕳️ Bache
            </option>

            <option>
              💧 Fuga de agua
            </option>

            <option>
              🗑️ Basura acumulada
            </option>

            <option>
              🚦 Semáforo descompuesto
            </option>

            <option>
              🌳 Espacio público deteriorado
            </option>

            <option>
              ⚠️ Otro
            </option>

          </select>

        </label>


        <label>

          Descripción

          <textarea
            id="description"
            maxlength="500"
            rows="4"
            required
          ></textarea>

        </label>


        <label>

          Fotografía

          <input
            id="photo"
            type="file"
            accept="image/*"
            capture="environment"
          >

        </label>


        <label>

          Video (máximo 10 segundos)

          <input
            id="video"
            type="file"
            accept="video/*"
            capture="environment"
          >

          <small>
            El piloto valida la duración.
          </small>

        </label>


        <!-- GPS -->

        <div class="location-box">

          <b>
            Ubicación
          </b>

          <span id="locationStatus">
            Aún no obtenida
          </span>

          <button
            type="button"
            id="getLocation"
            class="secondary"
          >
            Obtener GPS
          </button>

        </div>


        <!-- PREVISUALIZACIÓN -->

        <div id="preview"></div>


        <!-- PUBLICAR -->

        <button
          class="primary"
          type="submit"
        >
          Publicar reporte
        </button>

      </form>

    </div>

  </div>


  <!-- =========================
       DETALLE
  ========================== -->

  <div
    id="detailModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="panel-head">

        <h2>
          Detalle
        </h2>

        <button
          id="closeDetail"
          type="button"
        >
          ×
        </button>

      </div>

      <div id="detail"></div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
